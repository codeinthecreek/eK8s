name: CI

on:
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '**/testdata/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '**/testdata/**'
      - '.github/workflows/ci.yml'
  # govulncheck results change as advisories are published, not only when
  # Go code changes; the weekly run catches those, dispatch runs it by hand.
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Gate tests fail, not skip, without bwrap, nsenter or a docker
      # daemon (the runner image has docker; nsenter is in util-linux).
      EK8S_GATE_REQUIRE_TOOLS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step needs git auth, and the job runs third-party
          # module code that could otherwise read the token from .git/config.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest patch of the go directive's minor, not go-version-file:
          # go.mod pins exactly 1.26.0, whose fixed stdlib vulns would make
          # govulncheck noisy. Pinned exactly, with go.mod's toolchain line
          # and deploy.yml, for each Go security patch: setup-go checks the
          # runner's tool cache first, so '1.26.x' can match an older cached
          # patch. Unpin only with check-latest: true (re-check setup-go's
          # resolution first).
          go-version: '1.26.10'
      # Gate Stage 1 boots the candidate under bubblewrap.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
      # Ubuntu >= 23.10 restricts unprivileged user namespaces through
      # AppArmor (kernel.apparmor_restrict_unprivileged_userns=1): bwrap
      # gets a user namespace without capabilities and cannot set up the
      # sandbox's loopback ("loopback: Failed RTM_NEWADDR"). The tests stay
      # unprivileged; only this host knob changes.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -show verbose ./...
