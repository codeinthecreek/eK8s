name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step needs git auth, and the job runs third-party
          # module code that could otherwise read the token from .git/config.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest patch of the go directive's minor, not go-version-file:
          # go.mod pins exactly 1.26.0, whose fixed stdlib vulns would make
          # govulncheck noisy.
          go-version: '1.26.x'
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -show verbose ./...
