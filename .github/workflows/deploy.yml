name: deploy smoke

# Brings up the kind cluster at CI size and runs deploy/smoke.sh, then
# deploy/variant-smoke.sh (one variant bundle and a loadgen stand-in:
# readiness, ingress from loadgen only, the control port through the API
# server's proxy only, loadgen's and the variant's egress, endpoints of a
# terminating pod, namespace deletion), then deploy/loadgen-smoke.sh
# (loadgen itself: readiness, memory limits, the policy canary, its one
# listener, every control endpoint through the API server's proxy, the
# largest upload), then deploy/stage5-smoke.sh (gate Stage 5 end to end:
# gen 0 deployed, a real burst, host verification), then
# deploy/orchestrator-smoke.sh (the end-to-end dry run: the orchestrator for
# 2 generations with a fake claude under bwrap; the records and the
# cluster checked), then fails on any "Unblocking pod creation" line in
# Calico's CNI log (a pod started before its policy was programmed, by any
# smoke). It proves the mechanics (pinned
# images, kustomizations, metrics-server, stress-ng on and off, the
# variant bundle, ek8s-system), not the full-size numbers: those need the workstation
# (docs/STATUS.md, Parked).
# It runs only by hand: Actions tab, deploy smoke, Run workflow, on the PR's
# branch. Dispatch it when the planning chat asks for it, and before merging a
# PR that touches a path listed in deploy/README.md (CI paragraph).
# workflow_dispatch only works once this file is on the default branch.
on:
  # No pull_request trigger: the smoke is dispatched by hand (see above).
  workflow_dispatch:

permissions:
  contents: read

# One run per ref (a PR's branch, or main). This workflow has only the
# dispatch trigger, so cancel-in-progress is off (its expression is false):
# a dispatch queues behind the run before it and never cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      KUBECTL_VERSION: v1.37.0
      KUBECTL_SHA256: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
      # CI size (deploy/README.md): 2-CPU runner.
      EK8S_KIND_CONFIG: kind/cluster-ci.yaml
      EK8S_STRESS_KUSTOMIZE: stress-ci
      EK8S_RESERVED_CPU_MILLIS: '10'
      EK8S_STRESS_MIN_CPU_MILLIS: '250'
      # loadgen's CPU request at CI size (limit stays 1); read by
      # deploy/loadgen-up.sh, so loadgen-smoke.sh and stage5-smoke.sh both
      # get it. The node cannot hold a whole-core request beside the system
      # pods, stress-ng and a candidate.
      EK8S_LOADGEN_CPU_REQUEST: '100m'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Kubernetes 1.35+ (the v1.37.0 node image) needs a cgroup v2 host.
      - name: Require cgroup v2
        run: |
          fs=$(stat -fc %T /sys/fs/cgroup)
          if [ "$fs" != cgroup2fs ]; then
            echo "::error::/sys/fs/cgroup is $fs, not cgroup2fs: the kind v1.37.0 node needs cgroup v2"
            exit 1
          fi
      # variant-smoke.sh builds generation 0's image and runs the renderer.
      # Same pin as ci.yml (see the comment there).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
      # The diag's pure helpers (stop rule, verdict, drop counting); no cluster.
      - run: deploy/diag/stage5-runs_test.sh
      - name: Install kind and kubectl (checksum-verified)
        run: |
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum -c -
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum -c -
          sudo install -m 0755 kind kubectl /usr/local/bin/
          rm kind kubectl
          kind version
          kubectl version --client
      - run: deploy/up.sh
      - run: deploy/smoke.sh
      - run: deploy/variant-smoke.sh
      - run: deploy/loadgen-smoke.sh
      - run: deploy/stage5-smoke.sh
      # Gate Stage 1 boots the candidate under bubblewrap, and the driver
      # runs the fake claude under it; both as in ci.yml (see the comments
      # there). gcc and libc.a for Stage 4's -race build are on the runner.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: End-to-end dry run
        timeout-minutes: 20
        run: deploy/orchestrator-smoke.sh
      # Calico's CNI plugin logs "Unblocking pod creation" when it started a
      # pod before Felix reported the pod's policy programmed
      # (policy_setup_timeout_seconds, deploy/calico). variant-smoke.sh
      # checks its own pods; this step covers every smoke's pods. The log
      # rotates only at 100 MB, so one file must hold it all, and it must
      # show the last two smokes' pods (stage5-smoke's ek8s-v999998,
      # orchestrator-smoke's generation 0 in ek8s-v0), or it stopped being
      # written.
      - name: No pod started before its policy
        run: |
          files=$(docker exec ek8s-control-plane ls /var/log/calico/cni)
          if [ "$files" != cni.log ]; then
            echo "::error::/var/log/calico/cni holds '$files', want only cni.log (rotated?)"
            exit 1
          fi
          log=$(docker exec ek8s-control-plane cat /var/log/calico/cni/cni.log)
          for ns in ek8s-v999998 ek8s-v0; do
            if ! grep -qE "$ns([^0-9]|\$)" <<<"$log"; then
              echo "::error::the node's CNI log has no line for namespace $ns"
              exit 1
            fi
          done
          if grep -F 'Unblocking pod creation' <<<"$log"; then
            echo "::error::the CNI started a pod before its policy was programmed (lines above)"
            exit 1
          fi
          echo "no 'Unblocking pod creation' line in $(grep -c . <<<"$log") CNI log lines"
      - name: Dump cluster state
        if: failure()
        run: |
          k() { kubectl --context kind-ek8s "$@"; }
          k get pods -A -o wide || true
          k describe node || true
          # Every pod in the namespaces this PR deploys into, with events.
          for ns in ek8s-stress kube-system ek8s-system ek8s-v999999 ek8s-v999998 ek8s-v0 ek8s-v1 ek8s-v2 ek8s-v3; do
            echo "=== pods in $ns"
            k -n "$ns" describe pods || true
          done
          # Elsewhere, any pod with a container not ready (or none started
          # yet). Phase alone misses CrashLoopBackOff: it stays Running.
          k get pods -A --no-headers \
            -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{" "}{.status.containerStatuses[*].ready}{"\n"}{end}' 2>/dev/null |
            while read -r ns name ready; do
              case "$ns" in ek8s-stress|kube-system|ek8s-system|ek8s-v999999|ek8s-v999998|ek8s-v0|ek8s-v1|ek8s-v2|ek8s-v3) continue ;; esac
              if [ -z "$ready" ] || [[ " $ready " == *" false "* ]]; then
                echo "--- $ns/$name (ready: ${ready:-none})"
                k -n "$ns" describe pod "$name" || true
              fi
            done
          k -n ek8s-v999999 logs deploy/hasher --tail=50 || true
          k -n ek8s-v999998 logs deploy/hasher --tail=50 || true
          k -n ek8s-system logs deploy/loadgen --tail=50 || true
          k get networkpolicies,limitranges,hpa -A || true
          k -n ek8s-v999999 get endpointslices -o yaml || true
          k -n ek8s-system get services,endpointslices -o wide || true
          # Calico enforces the NetworkPolicies: calico-node's log around a
          # failure, and the CNI plugin's own log on the node (pod setup,
          # including any "Unblocking pod creation" policy-wait timeout).
          k -n kube-system logs ds/calico-node -c calico-node --since=10m || true
          docker exec ek8s-control-plane tail -n 200 /var/log/calico/cni/cni.log || true
          k get events -A --sort-by=.lastTimestamp | tail -n 50 || true
      - name: Delete cluster
        if: always()
        run: kind delete cluster --name ek8s || true
