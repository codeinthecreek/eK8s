# CI-size variant of cluster.yaml, for .github/workflows/deploy.yml: the
# private repo's ubuntu-latest runner has 2 CPU / 8 GB, too small for the
# full 1 CPU / 2Gi reservation plus the control plane and stress-ng. Same
# kind version, node image and name; only the reservation differs (CPU 10m,
# the least that keeps smoke.sh's exact reservation check meaningful, so the
# dry run's variants fit).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ek8s
networking:
  apiServerAddress: "127.0.0.1"
nodes:
- role: control-plane
  image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    kubeReserved:
      cpu: "10m"
      memory: "256Mi"
