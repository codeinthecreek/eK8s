# metrics-server v0.9.0 (supports Kubernetes 1.34+). components.yaml is the
# release asset, unmodified:
#   https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml
#   sha256 1cec29a5267809306a2c6ec74a3e449abbb705b4a8beed0c8a1963910f72c79b
# Apply with: kubectl --context kind-ek8s apply -k deploy/metrics-server
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- components.yaml
images:
# The v0.9.0 digest, from the image promoter manifest
# (kubernetes/k8s.io registry.k8s.io/images/k8s-staging-metrics-server/images.yaml).
- name: registry.k8s.io/metrics-server/metrics-server
  digest: sha256:d9862115e7c7881280d3d75ca26bda8ffc0fc213315979575bf23ce9826205c0
patches:
# kind's kubelet serving certificate is not signed by the cluster CA, so
# metrics-server skips that check. Acceptable on a single-node cluster whose
# API server listens on loopback only.
- target:
    kind: Deployment
    name: metrics-server
    namespace: kube-system
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --kubelet-insecure-tls
