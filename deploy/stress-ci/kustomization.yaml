# CI-size overlay of deploy/stress for .github/workflows/deploy.yml: the same
# objects, with stress-ng shrunk to fit a 2-CPU runner. Proves the mechanics
# (image load, PSA restricted, dose from the ConfigMap, on/off), not the
# full-size numbers.
# Apply with: kubectl --context kind-ek8s apply -k deploy/stress-ci
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../stress
patches:
- target:
    kind: Deployment
    name: stress-ng
    namespace: ek8s-stress
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources
      value:
        requests: {cpu: 500m, memory: 512Mi}
        limits: {cpu: 500m, memory: 512Mi}
- target:
    kind: ConfigMap
    name: stress-dose
    namespace: ek8s-stress
  patch: |-
    - op: replace
      path: /data
      value:
        CPU_WORKERS: "1"
        CPU_LOAD: "100"
        VM_WORKERS: "1"
        VM_BYTES: "128M"
