# stress-ng needs no network: deny all ingress and egress (enforced by
# Calico, deploy/calico; deploy/variant-smoke.sh check (j) probes it).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: ek8s-stress
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
